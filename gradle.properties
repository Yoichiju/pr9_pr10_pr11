# Project-wide Gradle settings.

# JVM-настройки для сборки
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# === КРИТИЧЕСКИ ВАЖНО: включает AndroidX ===
android.useAndroidX=true

# Автоматическая конвертация старых библиотек в AndroidX
android.enableJetifier=true

# Ускоряет сборку и уменьшает APK
android.nonTransitiveRClass=true

# Параллельная сборка модулей
org.gradle.parallel=true

# Кэш сборки (ускоряет повторные сборки)
org.gradle.caching=true